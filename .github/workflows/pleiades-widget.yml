name: pleiades-widget

on:
  push:
    branches: [master]
    tags: ["widget-v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Check types
        run: cd packages/pleiades-widget && bun run check-types
      - name: Lint
        run: cd packages/pleiades-widget && bun run lint
      - name: Test
        run: cd packages/pleiades-widget && bun run test
      - name: Build
        run: cd packages/pleiades-widget && bun run build

  publish-npm:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/widget-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build
        run: cd packages/pleiades-widget && bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Remove devEngines (npm 10 blocks bun packageManager)
        run: node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devEngines;fs.writeFileSync('package.json',JSON.stringify(p,null,'\t')+'\n');"
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: packages/pleiades-widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: Publish to JSR
    needs: test
    if: startsWith(github.ref, 'refs/tags/widget-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build
        run: cd packages/pleiades-widget && bun run build
      - name: Publish to JSR
        run: bunx --bun jsr publish
        working-directory: packages/pleiades-widget
