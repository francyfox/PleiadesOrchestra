name: CI
# Repo-wide lint, type check and unit tests (turbo fans out per workspace).
# `bun run test:beta-text` boots the real llama-server image and `test:e2e`
# needs a browser — both stay out of CI on purpose.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      # Turborepo Remote Cache (lint/types/test are deterministic). Absent on fork PRs (no secrets):
      # turbo then falls back to the local cache below. Not set in docs.yml/orchestra.yml on purpose:
      # a cache hit would skip the changelog fetch and the Sentry source map upload, and a PR branch
      # could write entries those deploy builds would trust.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          # Same Bun as root package.json devEngines (the version that writes bun.lock).
          bun-version: 1.4.3
      - name: Turbo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test
