name: release
# Tag `vX.Y.Z` → push the stack (alpha-orchestrator + admin-api, no models) as ONE image,
# ghcr.io/<owner>/pleiades (X.Y.Z, X.Y and latest), and cut a GitHub
# release whose notes are generated from the commits since the previous `v*` tag.
# The widget has its own `widget-v*` tags (pleiades-widget.yml); they don't match here.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Deploys come from master only: a tag on a develop/feature commit must not publish.
      - name: Tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pleiades
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # shortcut: amd64 only (arm64 under QEMU is very slow), Apple Silicon runs it emulated; add a platform when needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pleiades/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pleiades
          cache-to: type=gha,mode=max,scope=pleiades

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n 2p)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${prev:+--notes-start-tag "$prev"}
          # A release made with GITHUB_TOKEN triggers no workflows: rebuild the docs (changelog page) by hand.
          gh workflow run docs.yml

  # The albedo CLI as standalone binaries (no Bun needed on the target), attached to the release:
  # Linux x64/arm64 (glibc and musl) and macOS x64/arm64, cross-compiled on one runner.
  cli:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      # `--os/--cpu '*'`: the CLI's TUI dependency ships its native part per platform, and a plain install fetches only this runner's.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64; do
            bun build apps/cli/src/index.ts --compile --target="bun-$target" --outfile "dist/albedo-$target"
          done
          (cd dist && sha256sum albedo-* > albedo-checksums.txt)
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
