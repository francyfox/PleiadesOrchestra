services:
  albedo:
    build:
      context: .
      dockerfile: apps/albedo/Dockerfile
    env_file:
      - .env
    ports:
      - "8181:8080"
    volumes:
      - albedo-models:/models

  harness:
    build:
      context: .
      dockerfile: apps/harness/Dockerfile
    env_file:
      - apps/harness/.env
    environment:
      # Talk to the albedo service over the compose network instead of its
      # public Railway URL from apps/harness/.env.
      LLM_BASE_URL: http://albedo:8080/v1
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env (same value as albedo)}
      # Shared secret with telegram-bot — sourced from the root .env so both
      # services always agree on it, instead of syncing it by hand across
      # apps/harness/.env and apps/telegram-bot/.env.
      HARNESS_API_KEY: ${HARNESS_API_KEY:?set HARNESS_API_KEY in .env (same value as telegram-bot)}
    ports:
      - "3000:3000"
    depends_on:
      albedo:
        condition: service_healthy

  memory:
    build:
      context: .
      dockerfile: apps/memory/Dockerfile
    ports:
      - "6666:6666"
      - "8082:8080"
    volumes:
      - turingdb-data:/data

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    env_file:
      - apps/telegram-bot/.env
    environment:
      # Talk to the harness service over the compose network instead of its
      # public Railway URL from apps/telegram-bot/.env.
      HARNESS_BASE_URL: http://harness:3000
      HARNESS_API_KEY: ${HARNESS_API_KEY:?set HARNESS_API_KEY in .env (same value as harness)}
    ports:
      - "3001:3000"
    depends_on:
      - harness
    # Webhook mode needs a publicly reachable TELEGRAM_WEBHOOK_URL (e.g. an
    # ngrok/cloudflared tunnel to localhost:3001) — opt in explicitly:
    #   docker compose --profile bot up
    profiles:
      - bot

volumes:
  albedo-models:
  turingdb-data:
