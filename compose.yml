name: pleiades-orchestra

services:
  alpha-orchestrator:
    build:
      context: .
      dockerfile: apps/alpha-orchestrator/Dockerfile
    env_file:
      - apps/alpha-orchestrator/.env
    environment:
      # Talk to the beta-text/gamma-decision services over the compose network —
      # apps/alpha-orchestrator/.env(.example) defaults to localhost ports, for
      # running alpha-orchestrator standalone outside compose.
      LLM_BASE_URL: http://beta-text:8080/v1
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env (same value as beta-text)}
      LAYA_API_BASE_URL: http://gamma-decision:8080
      LAYA_API_KEY: ${LAYA_API_KEY:?set LAYA_API_KEY in .env (same value as gamma-decision)}
      # Shared secret with telegram-bot — sourced from the root .env so both
      # services always agree on it, instead of syncing it by hand across
      # apps/alpha-orchestrator/.env and apps/telegram-bot/.env.
      HARNESS_API_KEY: ${HARNESS_API_KEY:?set HARNESS_API_KEY in .env (same value as telegram-bot)}
      # Shared with the admin service — same root-.env pattern as HARNESS_API_KEY.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env (same value as admin)}
      DATABASE_PATH: /data/orchestrator.db
    # SQLite on the host, not in a Docker volume: visible, easy to back up,
    # survives `docker compose down -v`. ./data is gitignored.
    volumes:
      - ./data/alpha-orchestrator:/data
    ports:
      - "3000:3000"
    depends_on:
      beta-text:
        condition: service_healthy
      gamma-decision:
        condition: service_healthy

  beta-text:
    build:
      context: .
      dockerfile: apps/beta-text/Dockerfile
    env_file:
      - .env
    ports:
      - "8181:8080"
    volumes:
      - beta-text-models:/models
    # Vulkan на встроенном Radeon: рендер-нода GPU внутрь контейнера.
    # renderD128 на хосте и так crw-rw-rw-, group_add — на случай более строгих прав.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-989}"
      - "${VIDEO_GID:-985}"

  gamma-decision:
    build:
      context: .
      dockerfile: apps/gamma-decision/Dockerfile
    env_file:
      - apps/gamma-decision/.env
    ports:
      - "8090:8080"
    volumes:
      - gamma-decision-models:/root/.cache/receptron-laya

#  admin:
