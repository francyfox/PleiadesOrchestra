#      - apps/admin/.env
#    environment:
#      # Explicit: apps/admin/.env sets a relative ./data/admin.db for local dev, which
#      # inside the container resolved to /app/data — the container layer, not the
#      # mount — and every recreate wiped all admin accounts.
#      ADMIN_DATABASE_PATH: /data/admin.db
#      HARNESS_BASE_URL: http://alpha-orchestrator:3000
#      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env (same value as alpha-orchestrator)}
#      # SvelteKit's CSRF check and better-auth both compare against the URL the
#      # panel is actually opened at.
#      ORIGIN: http://localhost:3002
#      BETTER_AUTH_URL: http://localhost:3002
#    volumes:
