  # Named Cloudflare Tunnel (albedo.shalotts.site) -> alpha-orchestrator's
  # public agent routes only; cloudflared/config.yml whitelists the paths and
  # 404s the rest (admin, transport, swagger). Token auth instead of mounting
  # the credentials JSON: the image runs as uid 65532 and can't read a 0400
  # file owned by the host user. CLOUDFLARE_TUNNEL_TOKEN = base64 {a: AccountTag,
  # t: TunnelID, s: TunnelSecret} from ~/.cloudflared/<tunnel-id>.json (see .env.example).
